name: CI-CD Demo

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Validate HTML Exists
      run: |
        ls
        test -f index.html

    - name: Build Artifact
      run: |
        mkdir output
        cp index.html output/

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: website
        path: output/

  deploy:
    needs: build

    runs-on: ubuntu-latest

    steps:
    - name: Download Artifact
      uses: actions/download-artifact@v4
      with:
        name: website

    - name: Deploy Message
      run: echo "Deploy Complete"
